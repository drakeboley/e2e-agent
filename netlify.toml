[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  CYPRESS_INSTALL_BINARY = "0"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
  PUPPETEER_SKIP_DOWNLOAD = "true"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200

[[redirects]]
  from = "/mcp"
  to = "/.netlify/functions/api/api/mcp"
  status = 200

[[redirects]]
  from = "/health"
  to = "/.netlify/functions/api/health"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms/index.html"
  status = 200

# Netlify Build Plugin for e2ebot autonomous testing
[[plugins]]
  package = "./packages/netlify-plugin-e2ebot"

  [plugins.inputs]
    apiUrl = "http://localhost:3000"
    runSmoke = false
    runCypress = false
    failOnError = false
